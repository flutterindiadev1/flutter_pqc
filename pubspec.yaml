name: flutter_pqc
description: "A production-ready Flutter FFI plugin for Post-Quantum Cryptography (PQC). Cross-platform wrapper around liboqs supporting ML-KEM and ML-DSA."
version: 0.0.1
homepage: https://github.com/example/flutter_pqc
repository: https://github.com/example/flutter_pqc

environment:
  sdk: ^3.13.0

dependencies:
  code_assets: ^1.1.0
  ffi: ^2.2.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
